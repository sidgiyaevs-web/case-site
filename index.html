<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>Beta Case</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
:root{
  --bg:#0a0e14;--bg2:#151a24;--bg3:#1c232f;--bg4:#252d3d;
  --text:#fff;--text-dim:#8b95a5;--text-mute:#5a6373;
  --accent:#ffcc00;--accent2:#ff9500;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#a371f7;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'SF Pro Display','Inter',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body{padding-bottom:100px;background:radial-gradient(ellipse at top, rgba(59,130,246,0.15), transparent 50%), var(--bg);}

.header{position:sticky;top:0;z-index:100;background:rgba(10,14,20,0.9);backdrop-filter:blur(20px);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#fff,#74c0fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.balance-bar{display:flex;gap:8px;}
.balance-item{background:rgba(255,255,255,0.06);padding:8px 14px;border-radius:20px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;border:1px solid var(--border2);}
.balance-item .add-btn{margin-left:4px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
.balance-item .add-btn:active{transform:scale(0.9);}

.live-strip{background:rgba(255,255,255,0.03);padding:12px 14px;display:flex;align-items:center;gap:12px;overflow:hidden;border-bottom:1px solid var(--border);}
.live-label{color:var(--red);font-weight:900;font-size:13px;letter-spacing:1px;flex-shrink:0;background:rgba(239,68,68,0.15);padding:6px 12px;border-radius:8px;}
.live-items{display:flex;gap:8px;animation:scroll-live 40s linear infinite;align-items:center;}
@keyframes scroll-live{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.live-item{flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.live-item img{width:32px;height:32px;object-fit:contain;}

.page{display:none;}
.page.active{display:block;}
.page-title{font-size:26px;font-weight:900;padding:22px 18px 12px;letter-spacing:-0.5px;}

.cases-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 14px 20px;}
.case-card{background:linear-gradient(145deg,#1e2536,#151a24);border-radius:22px;padding:20px 14px 16px;cursor:pointer;border:1px solid var(--border2);position:relative;overflow:hidden;transition:transform 0.15s;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
.case-card:active{transform:scale(0.96);}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:100%;background:radial-gradient(circle at 50% 30%, var(--case-color, #5865F2), transparent 70%);opacity:0.22;pointer-events:none;}
.case-card-emoji{font-size:78px;line-height:1;position:relative;z-index:1;margin-top:8px;filter:drop-shadow(0 8px 20px var(--case-color, rgba(88,101,242,0.6)));}
.case-card-name{font-size:17px;font-weight:900;letter-spacing:-0.3px;position:relative;z-index:1;margin-top:12px;}
.case-card-price{background:rgba(255,204,0,0.12);color:var(--accent);padding:8px 16px;border-radius:14px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px;position:relative;z-index:1;margin-top:auto;border:1px solid rgba(255,204,0,0.2);}
.case-card-price.free{background:rgba(16,185,129,0.15);color:var(--green);border-color:rgba(16,185,129,0.3);}

.case-header{display:flex;align-items:center;gap:12px;padding:16px;}
.back-btn{background:var(--bg3);border:none;color:var(--text);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.case-title{font-size:22px;font-weight:900;flex:1;}

.roulette-wrap{position:relative;margin:22px 14px;background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:22px;padding:30px 0;overflow:hidden;border:1px solid var(--border2);}
.roulette-arrow{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid var(--accent);z-index:10;filter:drop-shadow(0 0 10px rgba(255,204,0,0.8));}
.roulette{overflow:hidden;position:relative;padding:20px 0;}
.roulette-track{display:flex;gap:12px;will-change:transform;}
.roulette-track.animate{transition:transform 4s cubic-bezier(0.15, 0.9, 0.3, 1);}
.roulette-item{width:100px;height:130px;flex-shrink:0;background:rgba(255,255,255,0.05);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;padding:8px 4px;overflow:hidden;}
.roulette-item .it-img{width:60px;height:60px;object-fit:contain;flex-shrink:0;}
.roulette-item .it-name{font-size:9px;color:var(--text-dim);text-align:center;padding:0 4px;font-weight:700;line-height:1.15;}
.roulette-item.rarity-common{border-color:rgba(139,149,165,0.3);}
.roulette-item.rarity-rare{border-color:rgba(59,130,246,0.5);background:rgba(59,130,246,0.08);}
.roulette-item.rarity-epic{border-color:rgba(163,113,247,0.6);background:rgba(163,113,247,0.1);}
.roulette-item.rarity-legendary{border-color:rgba(255,204,0,0.8);background:rgba(255,204,0,0.1);box-shadow:0 0 16px rgba(255,204,0,0.4);}
.roulette-item.rarity-mythic{border-color:rgba(239,68,68,0.9);background:rgba(239,68,68,0.15);box-shadow:0 0 20px rgba(239,68,68,0.6);}

.case-actions{padding:0 14px;display:flex;flex-direction:column;gap:10px;}
.big-btn{width:100%;padding:22px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;border-radius:18px;font-size:18px;font-weight:900;cursor:pointer;transition:transform 0.15s;box-shadow:0 8px 24px rgba(59,130,246,0.4);}
.big-btn:active{transform:scale(0.97);}
.big-btn:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;}
.big-btn.gold{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;box-shadow:0 8px 24px rgba(255,204,0,0.4);}
.big-btn.purple{background:linear-gradient(135deg,var(--purple),#7048e8);color:#fff;box-shadow:0 8px 24px rgba(163,113,247,0.4);}

.items-list-title{font-size:18px;font-weight:900;padding:28px 18px 12px;}
.items-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 14px 24px;}
.item-card{background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid var(--border);}
.item-card .it-img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 8px;}
.item-card .it-name{font-size:10px;font-weight:700;margin-bottom:4px;line-height:1.2;}
.item-card .it-value{font-size:12px;font-weight:900;}

.profile-block{margin:14px;background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:20px;padding:24px;border:1px solid var(--border2);}
.profile-name{font-size:24px;font-weight:900;margin-bottom:20px;text-align:center;}
.stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px;}
.stat-row:last-child{border:none;}
.stat-row span:first-child{color:var(--text-dim);font-weight:600;}
.stat-row span:last-child{font-weight:900;}

.promo-block{margin:14px;background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:20px;padding:20px;border:1px solid var(--border2);}
.promo-title{font-size:16px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.promo-input-row{display:flex;gap:8px;}
.promo-input{flex:1;padding:14px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:15px;font-weight:800;text-transform:uppercase;outline:none;}
.promo-input:focus{border-color:var(--accent);}
.promo-btn{padding:14px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;white-space:nowrap;}
.promo-btn:active{transform:scale(0.96);}
.promo-hint{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.5;}

.inventory-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 20px;}
.inv-card{background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:16px;padding:14px 12px;text-align:center;border:1px solid var(--border2);position:relative;overflow:hidden;}
.inv-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--rarity-color,#888);}
.inv-card .it-img{width:64px;height:64px;object-fit:contain;display:block;margin:8px auto 10px;}
.inv-card .it-name{font-size:13px;font-weight:800;margin-bottom:4px;line-height:1.2;}
.inv-card .it-rarity{font-size:10px;font-weight:900;color:var(--rarity-color,#888);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;}
.inv-card .it-value{font-size:14px;color:var(--accent);font-weight:900;margin-bottom:12px;}
.inv-card .sell-btn{width:100%;padding:10px;background:rgba(255,255,255,0.06);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-weight:800;font-size:12px;cursor:pointer;}
.inv-card .sell-btn:active{background:var(--green);color:#fff;border-color:var(--green);}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;}

/* UPGRADE */
.upgrade-block{margin:14px;background:linear-gradient(145deg,#1a2030,#0f1520);border-radius:20px;padding:20px;border:1px solid var(--border2);}
.upgrade-title{font-size:18px;font-weight:900;margin-bottom:14px;text-align:center;}
.upgrade-items{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.upgrade-slot{background:var(--bg3);border-radius:14px;padding:14px;text-align:center;border:2px dashed var(--border2);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.upgrade-slot.filled{border-style:solid;border-color:var(--accent);}
.upgrade-slot .slot-label{font-size:11px;color:var(--text-dim);font-weight:800;margin-bottom:8px;text-transform:uppercase;}
.upgrade-slot .it-img{width:60px;height:60px;object-fit:contain;}
.upgrade-slot .it-name{font-size:12px;font-weight:800;margin-top:6px;}
.upgrade-slot .it-value{font-size:12px;color:var(--accent);font-weight:900;margin-top:3px;}
.upgrade-chance{text-align:center;font-size:15px;font-weight:900;margin:14px 0;padding:12px;background:var(--bg3);border-radius:12px;border:1px solid var(--border2);}
.upgrade-chance .pct{color:var(--green);font-size:20px;}
.upgrade-chance .pct.bad{color:var(--red);}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,30,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--border2);display:flex;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:50;}
.nav-btn{flex:1;background:none;border:none;color:var(--text-dim);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px;}
.nav-btn.active{color:var(--blue);}
.nav-btn .nav-icon{font-size:24px;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;backdrop-filter:blur(8px);}
.modal.show{display:flex;}
.modal-content{background:linear-gradient(145deg,#1e2536,#0f1520);border-radius:28px;padding:32px 24px;max-width:360px;width:100%;text-align:center;border:2px solid var(--accent);animation:modal-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);max-height:80vh;overflow-y:auto;}
@keyframes modal-in{from{opacity:0;transform:scale(0.7);}to{opacity:1;transform:scale(1);}}
.modal-img{width:120px;height:120px;object-fit:contain;margin-bottom:12px;animation:emoji-pop 0.6s ease;}
@keyframes emoji-pop{0%{transform:scale(0.2) rotate(-30deg);}60%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
.modal-title{font-size:24px;font-weight:900;margin-bottom:10px;}
.modal-rarity{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:18px;}
.modal-value{font-size:34px;font-weight:900;color:var(--accent);margin-bottom:24px;}
.modal-btn{width:100%;padding:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:16px;font-size:17px;font-weight:900;cursor:pointer;margin-top:10px;}
.modal-btn.secondary{background:var(--bg3);color:var(--text);}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:2000;transition:transform 0.3s;max-width:90%;text-align:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);}

.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;max-height:400px;overflow-y:auto;}
.picker-item{background:var(--bg3);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.picker-item:active{transform:scale(0.96);}
.picker-item.selected{border-color:var(--accent);background:rgba(255,204,0,0.1);}
.picker-item .it-img{width:50px;height:50px;object-fit:contain;margin-bottom:6px;}
.picker-item .it-name{font-size:11px;font-weight:800;line-height:1.2;}
.picker-item .it-value{font-size:11px;color:var(--accent);font-weight:900;margin-top:3px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">BETA CASE</div>
  <div class="balance-bar">
    <div class="balance-item">
      <span>⭐</span>
      <span id="stars-balance">1000</span>
      <span class="add-btn" onclick="addStars()">+</span>
    </div>
    <div class="balance-item">
      <span>💎</span>
      <span id="crystals-balance">0</span>
    </div>
  </div>
</div>

<div class="live-strip">
  <div class="live-label">LIVE</div>
  <div class="live-items" id="live-items"></div>
</div>

<!-- INDEX -->
<div class="page active" id="page-index">
  <h1 class="page-title">Кейсы</h1>
  <div class="cases-grid" id="cases-grid"></div>
</div>

<!-- CASE -->
<div class="page" id="page-case">
  <div class="case-header">
    <button class="back-btn" onclick="showPage('index')">←</button>
    <div class="case-title" id="case-title">Кейс</div>
  </div>
  <div class="roulette-wrap">
    <div class="roulette-arrow"></div>
    <div class="roulette">
      <div class="roulette-track" id="roulette-track"></div>
    </div>
  </div>
  <div class="case-actions">
    <button class="big-btn" id="open-btn" onclick="openCase()">Крутить</button>
  </div>
  <div class="items-list-title">Что выпадает</div>
  <div class="items-grid" id="items-grid"></div>
</div>

<!-- PROFILE -->
<div class="page" id="page-profile">
  <div class="case-header">
    <button class="back-btn" onclick="showPage('index')">←</button>
    <div class="case-title">Профиль</div>
  </div>
  <div class="profile-block">
    <div class="profile-name" id="profile-name">Игрок</div>
    <div class="stat-row"><span>Открыто кейсов</span><span id="stat-opened">0</span></div>
    <div class="stat-row"><span>Потрачено</span><span id="stat-spent">0 ⭐</span></div>
    <div class="stat-row"><span>Выиграно</span><span id="stat-won">0 ⭐</span></div>
    <div class="stat-row"><span>Предметов</span><span id="stat-items">0</span></div>
    <div class="stat-row"><span>Апгрейдов</span><span id="stat-upgrades">0</span></div>
  </div>

  <div class="promo-block">
    <div class="promo-title">🎟️ Промокод</div>
    <div class="promo-input-row">
      <input type="text" class="promo-input" id="promo-input" placeholder="Введи код" autocomplete="off">
      <button class="promo-btn" onclick="activatePromo()">Активировать</button>
    </div>
    <div class="promo-hint">Доступные коды: <b>BETA10000</b> (+10 000 ⭐) · <b>BETA50000</b> (+50 000 ⭐)</div>
  </div>

  <div class="items-list-title">Инвентарь</div>
  <div class="inventory-grid" id="inventory-grid"></div>
</div>

<!-- UPGRADE -->
<div class="page" id="page-upgrade">
  <div class="case-header">
    <button class="back-btn" onclick="showPage('index')">←</button>
    <div class="case-title">Апгрейд</div>
  </div>
  <div class="upgrade-block">
    <div class="upgrade-title">Выбери свой предмет</div>
    <div class="upgrade-items">
      <div class="upgrade-slot" id="upgrade-slot1" onclick="pickUpgradeItem(1)"><div class="slot-label">Твой</div></div>
      <div class="upgrade-slot" id="upgrade-slot2" onclick="pickUpgradeItem(2)"><div class="slot-label">Цель</div></div>
    </div>
    <div class="upgrade-chance" id="upgrade-chance">Шанс апгрейда: —</div>
    <button class="big-btn purple" onclick="doUpgrade()" id="upgrade-btn" disabled>Апгрейд</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('index')" id="nav-index">
    <span class="nav-icon">🎁</span>
    <span>Кейсы</span>
  </button>
  <button class="nav-btn" onclick="showPage('upgrade')" id="nav-upgrade">
    <span class="nav-icon">⚡</span>
    <span>Апгрейд</span>
  </button>
  <button class="nav-btn" onclick="showPage('profile')" id="nav-profile">
    <span class="nav-icon">👤</span>
    <span>Профиль</span>
  </button>
</nav>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// КАРТИНКИ (Twitter Twemoji CDN)
// ==========================================
var IMG = {
  bear:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43b.png',
  star:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2b50.png',
  gift:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f380.png',
  lamp:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3ee.png',
  pen:     'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f58a.png',
  doll:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f9f8.png',
  mask:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3ad.png',
  crown:   'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f451.png',
  ring:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f48d.png',
  diamond: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f48e.png',
  happyBear:'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43b.png',
  angel:   'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f607.png',
  lion:    'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f981.png',
  panda:   'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f43c.png',
  joy:     'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f579.png',
  gamepad: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3ae.png',
  vr:      'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f97d.png',

function loadState() {
  try {
    var saved = localStorage.getItem('betacase_state');
    if (saved) {
      var p = JSON.parse(saved);
      for (var k in p) state[k] = p[k];
    }
    if (!state.inventory) state.inventory = [];
    if (!state.promosUsed) state.promosUsed = {};
    if (state.upgrades === undefined) state.upgrades = 0;
  } catch(e){}
}
function saveState() {
  try { localStorage.setItem('betacase_state', JSON.stringify(state)); } catch(e){}
}
function updateBalanceUI() {
  document.getElementById('stars-balance').textContent = state.stars;
  document.getElementById('crystals-balance').textContent = state.crystals;
}
function addStars() {
  var n = prompt('Сколько звёзд добавить?', '10000');
  if (!n) return;
  var num = parseInt(n);
  if (isNaN(num) || num <= 0) return;
  if (num > 1000000) num = 1000000;
  state.stars += num;
  saveState();
  updateBalanceUI();
  showToast('+' + num + ' ⭐');
}

// ==========================================
// OPEN CASE
// ==========================================
function weightedRandom(items) {
  var total = 0;
  items.forEach(function(it){ total += it.weight; });
  var r = Math.random() * total;
  var acc = 0;
  for (var i = 0; i < items.length; i++) {
    acc += items[i].weight;
    if (r <= acc) return items[i];
  }
  return items[items.length - 1];
}

function openCase() {
  if (isRolling) return;
  var c = CASES[currentCaseId];
  if (!c) return;
  if (c.price > 0 && state.stars < c.price) {
    showToast('Недостаточно звёзд', true);
    return;
  }
  isRolling = true;
  var btn = document.getElementById('open-btn');
  btn.disabled = true;
  btn.textContent = 'Крутим...';
  if (c.price > 0) state.stars -= c.price;
  state.spent += c.price;
  state.opened += 1;
  saveState();
  updateBalanceUI();

  var winItem = weightedRandom(c.items);
  var rollItems = [];
  var winIndex = 35;
  for (var i = 0; i < 50; i++) {
    rollItems.push(i === winIndex ? winItem : c.items[Math.floor(Math.random() * c.items.length)]);
  }
  var track = document.getElementById('roulette-track');
  var html = '';
  rollItems.forEach(function(it){
    html += '<div class="roulette-item rarity-' + it.rarity + '">' +
      '<img class="it-img" src="' + it.img + '" alt="">' +
      '<span class="it-name">' + it.name + '</span>' +
    '</div>';
  });
  track.innerHTML = html;
  track.classList.remove('animate');
  track.style.transform = 'translateX(0)';

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var itemWidth = 112;
      var wrapWidth = track.parentElement.offsetWidth;
      var winOffset = winIndex * itemWidth;
      var centerOffset = winOffset - (wrapWidth / 2) + (itemWidth / 2);
      centerOffset += Math.random() * 30 - 15;
      track.classList.add('animate');
      track.style.transform = 'translateX(-' + centerOffset + 'px)';
    });
  });

  setTimeout(function() { onRollComplete(winItem, c); }, 4300);
}

function onRollComplete(item, c) {
  isRolling = false;
  var invItem = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,8),
    name: item.name, img: item.img, value: item.value,
    rarity: item.rarity, caseId: currentCaseId, date: Date.now()
  };
  state.inventory.unshift(invItem);
  if (state.inventory.length > 200) state.inventory = state.inventory.slice(0, 200);
  saveState();
  showWinModal(item);
  var btn = document.getElementById('open-btn');
  btn.disabled = false;
  btn.textContent = c.price === 0 ? 'Крутить бесплатно' : 'Крутить за ⭐ ' + c.price;
}

function showWinModal(item) {
  var color = RARITY_COLORS[item.rarity] || '#888';
  var mc = document.getElementById('modal-content');
  mc.innerHTML =
    '<img class="modal-img" src="' + item.img + '" alt="">' +
    '<div class="modal-title">' + item.name + '</div>' +
    '<div class="modal-rarity" style="color:' + color + '">' + (RARITY_NAMES[item.rarity] || item.rarity) + '</div>' +
    '<div class="modal-value">' + item.value + ' ⭐</div>' +
    '<button class="modal-btn" onclick="closeModal()">Забрать</button>';
  document.getElementById('modal').classList.add('show');
  if (navigator.vibrate) {
    if (item.rarity === 'mythic' || item.rarity === 'legendary') navigator.vibrate([50, 50, 100, 50]);
    else navigator.vibrate(30);
  }
  spawnConfetti(color);
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function spawnConfetti(color) {
  for (var i = 0; i < 40; i++) {
    var c = document.createElement('div');
    c.style.position = 'fixed';
    c.style.left = (Math.random() * 100) + '%';
    c.style.top = '-20px';
    c.style.width = '8px'; c.style.height = '8px';
    c.style.background = Math.random() > 0.3 ? color : '#fff';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.opacity = '0.9';
    c.style.pointerEvents = 'none';
    c.style.zIndex = '999';
    c.style.transition = 'transform 2.5s ease-out, opacity 2.5s';
    document.body.appendChild(c);
    (function(el, delay) {
      setTimeout(function() {
        var x = (Math.random() - 0.5) * 500;
        var y = window.innerHeight + 100;
        el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (Math.random()*720) + 'deg)';
        el.style.opacity = '0';
      }, delay);
      setTimeout(function() { el.remove(); }, 3000 + delay);
    })(c, i * 20);
  }
}

function renderProfile() {

  document.getElementById('stat-won').textContent = state.won + ' ⭐';

function renderInventory() {
  var grid = document.getElementById('inventory-grid');
  if (!state.inventory.length) {
    grid.innerHTML = '<div class="empty">Инвентарь пуст<br>Открой кейс, чтобы получить предмет</div>';
    return;
  }
  var html = '';
  state.inventory.forEach(function(it){
    var color = RARITY_COLORS[it.rarity] || '#888';
    var sellPrice = Math.floor(it.value * 0.7);
    html += '<div class="inv-card" style="--rarity-color:' + color + '">' +
      '<img class="it-img" src="' + it.img + '" alt="">' +
      '<div class="it-name">' + it.name + '</div>' +
      '<div class="it-rarity">' + (RARITY_NAMES[it.rarity] || it.rarity) + '</div>' +
      '<div class="it-value">' + it.value + ' ⭐</div>' +
      '<button class="sell-btn" onclick="sellItem(\'' + it.id + '\')">Продать за ' + sellPrice + '</button>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function sellItem(id) {
  var idx = state.inventory.findIndex(function(x){ return x.id === id; });
  if (idx === -1) return;
  var it = state.inventory[idx];
  var price = Math.floor(it.value * 0.7);
  state.stars += price;
  state.won += price;
  state.inventory.splice(idx, 1);
  saveState();
  updateBalanceUI();
  renderProfile();
  showToast('Продано за ' + price + ' ⭐');
}

function activatePromo() {
  var input = document.getElementById('promo-input');
  var code = (input.value || '').trim().toUpperCase();
  if (!code) { showToast('Введи код', true); return; }
  if (!PROMOS[code]) { showToast('Неверный код', true); return; }
  if (state.promosUsed[code]) { showToast('Код уже использован', true); return; }
  var reward = PROMOS[code].reward;
  state.stars += reward;
  state.promosUsed[code] = true;
  saveState();
  updateBalanceUI();
  input.value = '';
  showToast('✅ +' + reward + ' ⭐');
  renderProfile();
}

    s1.classList.add('filled');
    s1.innerHTML = '<div class="slot-label">Твой</div>' +

    s1.classList.remove('filled');
    s1.innerHTML = '<div class="slot-label">Твой</div><div style="font-size:36px;color:var(--text-dim);">+</div>';
  }
  if (upgradeSlot2) {
    s2.classList.add('filled');
    s2.innerHTML = '<div class="slot-label">Цель</div>' +
      '<img class="it-img" src="' + upgradeSlot2.img + '" alt="">' +
      '<div class="it-name">' + upgradeSlot2.name + '</div>' +
      '<div class="it-value">' + upgradeSlot2.value + ' ⭐</div>';
  } else {
    s2.classList.remove('filled');
    s2.innerHTML = '<div class="slot-label">Цель</div><div style="font-size:36px;color:var(--text-dim);">+</div>';
  }
  var chanceEl = document.getElementById('upgrade-chance');
  var btn = document.getElementById('upgrade-btn');
  if (upgradeSlot1 && upgradeSlot2) {
    var pct = (upgradeSlot1.value / upgradeSlot2.value) * 100;
    if (pct > 90) pct = 90;
    if (pct < 1) pct = 1;
    var pctRounded = Math.round(pct);
    var cls = pctRounded >= 50 ? '' : ' bad';
    chanceEl.innerHTML = 'Шанс апгрейда: <span class="pct' + cls + '">' + pctRounded + '%</span>';
    btn.disabled = false;
  } else {
    chanceEl.textContent = 'Шанс апгрейда: —';
    btn.disabled = true;
  }
}

function pickUpgradeItem(slot) {
  pickingForSlot = slot;
  var inv = state.inventory;
  if (!inv.length) {
    showToast('Инвентарь пуст', true);

      '<div class="it-name">' + it.name + '</div>' +
      '<div class="it-value">' + it.value + ' ⭐</div>' +

  });
  html += '</div>';
  html += '<button class="modal-btn secondary" style="margin-top:16px;" onclick="closeModal()">Отмена</button>';
  mc.innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function selectUpgradeItem(id) {
  var it = state.inventory.find(function(x){ return x.id === id; });
  if (!it) return;
  if (pickingForSlot === 1) {
    upgradeSlot1 = it;
  } else {
    upgradeSlot2 = it;
  }
  closeModal();
  renderUpgrade();
}

function doUpgrade() {
  if (!upgradeSlot1 || !upgradeSlot2) return;
  var it1 = upgradeSlot1;
  var it2 = upgradeSlot2;
  if (it1.value >= it2.value) {
    showToast('Цель должна быть дороже', true);
    return;
  }
  var pct = (it1.value / it2.value) * 100;
  if (pct > 90) pct = 90;
  if (pct < 1) pct = 1;
  var win = Math.random() * 100 < pct;
  var idx1 = state.inventory.findIndex(function(x){ return x.id === it1.id; });
  if (idx1 !== -1) state.inventory.splice(idx1, 1);
  state.upgrades += 1;
  if (win) {
    var newItem = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2,8),
      name: it2.name, img: it2.img, value: it2.value,
      rarity: it2.rarity, caseId: it2.caseId, date: Date.now()
    };
    state.inventory.unshift(newItem);
    showToast('🎉 Апгрейд успешен!');
    playUpgradeModal(true, it1, it2);
  } else {
    showToast('💥 Апгрейд не удался', true);
    playUpgradeModal(false, it1, it2);
  }
  upgradeSlot1 = null;
  upgradeSlot2 = null;
  saveState();
  renderUpgrade();
}

function playUpgradeModal(win, it1, it2) {
  var mc = document.getElementById('modal-content');
  var result = win ? it2 : it1;
  var color = RARITY_COLORS[result.rarity] || '#888';
  mc.innerHTML =
    '<img class="modal-img" src="' + result.img + '" alt="">' +
    '<div class="modal-title">' + (win ? '🎉 Успех!' : '💥 Провал') + '</div>' +
    '<div class="modal-rarity" style="color:' + color + '">' + result.name + '</div>' +
    '<div style="font-size:14px;color:var(--text-dim);margin-bottom:20px;line-height:1.5;">' +
      (win ? 'Ты получил <b>' + it2.name + '</b> стоимостью ' + it2.value + ' ⭐' :
             'Ты потерял <b>' + it1.name + '</b> стоимостью ' + it1.value + ' ⭐') +
    '</div>' +
    '<button class="modal-btn" onclick="closeModal()">OK</button>';
  document.getElementById('modal').classList.add('show');
  if (navigator.vibrate) navigator.vibrate(win ? [50, 50, 100] : [200]);
  if (win) spawnConfetti('#10b981');
}

// ==========================================
// TOAST
// ==========================================
var toastTimer;
function showToast(text, isError) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ==========================================
// INIT
// ==========================================
loadState();
updateBalanceUI();
initLiveStrip();
renderCases();
renderInventory();

document.getElementById('modal').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
</script>
